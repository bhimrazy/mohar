# Single CI source of truth for the billing app (the Laravel project lives in billing/).
# Design (billing/docs/devops/ci.md): ONE job to keep billable minutes low — every job is rounded up to a
# whole minute and pays its own setup, so policy, lint, types, static analysis, both test suites and the
# build share one runner, cheapest steps first. Docs/image-only PRs and pushes run only the formatter (in-job fast
# path, so the required check always reports). Draft PRs run only when labelled `ci`; feature-branch pushes do not run. Policy
# checks (lockfile sync, audits, cooldown) run before any dependency is installed or executed.
#
# Every third-party action and image is pinned to a commit SHA / digest and must be at least
# MIN_RELEASE_AGE_DAYS old (billing/docs/devops/dependency-policy.md). Dependabot (14-day cooldown)
# updates the actions and billing/compose.yaml images; it does NOT update `services:` images here, so
# CI fails when the postgres service image drifts from compose.yaml.
name: CI

on:
    push:
        branches:
            - main
            - develop
    pull_request:
        branches:
            - main
            - develop
        types: [opened, synchronize, reopened, ready_for_review, labeled]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    # Draft and ready runs use separate groups: a skipped draft run (e.g. a push landing just after
    # "Ready for review") must never cancel the real run.
    group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.event.pull_request.draft && !contains(github.event.pull_request.labels.*.name, 'ci')) && 'draft' || 'ready' }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
    run:
        working-directory: billing

env:
    XDEBUG_MODE: 'off'
    MIN_RELEASE_AGE_DAYS: '7'

jobs:
    ci:
        name: CI (policy, lint, types, static, tests, build)
        # Drafts skip CI unless labelled `ci` (then PostgreSQL runs before review, not only at merge time).
        # A `labeled` event only runs when the label added is `ci`.
        if: >-
            github.event_name != 'pull_request' ||
            (github.event.action == 'labeled' && github.event.label.name == 'ci') ||
            (github.event.action != 'labeled' && (github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'ci')))
        runs-on: ubuntu-24.04
        timeout-minutes: 25
        services:
            postgres:
                # Must equal the postgres image in billing/compose.yaml (asserted below).
                image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
                env:
                    POSTGRES_DB: billing_test
                    POSTGRES_USER: billing
                    POSTGRES_PASSWORD: billing
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U billing -d billing_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        permissions:
            contents: read
            pull-requests: read # read the security-exception label at run time (re-runs pick it up)
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  # PR: HEAD^1 of the merge commit is the base. Push: full history so github.event.before is present.
                  fetch-depth: ${{ github.event_name == 'push' && 0 || 2 }}

            - name: Detect docs-only change and diff base
              id: changes
              env:
                  EVENT: ${{ github.event_name }}
                  BEFORE: ${{ github.event.before }}
              run: |
                  code=true
                  base=--all
                  if [ "$EVENT" = pull_request ]; then
                      base=HEAD^1
                      files=$(git diff --name-only HEAD^1 HEAD)
                      if [ -n "$files" ] && [ -z "$(grep -vE '(\.md$|\.png$|^billing/docs/)' <<< "$files")" ]; then
                          code=false
                      fi
                  elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
                      && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                      base=$BEFORE
                      files=$(git diff --name-only "$BEFORE" HEAD)
                      if [ -n "$files" ] && [ -z "$(grep -vE '(\.md$|\.png$|^billing/docs/)' <<< "$files")" ]; then
                          code=false
                      fi
                  fi
                  {
                      echo "code=$code"
                      echo "base=$base"
                  } >> "$GITHUB_OUTPUT"
                  echo "Code changes: $code · dependency diff base: $base"

            - name: Set up PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: '8.4'
                  tools: composer:2.10.3
                  extensions: pdo_sqlite, pdo_pgsql, pgsql
                  coverage: none

            - name: Set up Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: billing/.nvmrc
                  cache: npm
                  cache-dependency-path: billing/package-lock.json

            - name: Postgres image matches compose.yaml
              if: steps.changes.outputs.code == 'true'
              run: |
                  pattern='postgres:[0-9.]+-alpine[0-9.]*@sha256:[0-9a-f]{64}'
                  compose_image=$(grep -Eo "$pattern" compose.yaml | sort -u)
                  ci_image=$(grep -Eo "$pattern" ../.github/workflows/ci.yml | sort -u)
                  prod_image=$(grep -Eo "$pattern" ../deploy/compose.prod.yaml 2>/dev/null | sort -u)
                  echo "compose.yaml:      ${compose_image:-<none>}"
                  echo "ci.yml:            ${ci_image:-<none>}"
                  echo "compose.prod.yaml: ${prod_image:-<none>}"
                  if [ -z "$compose_image" ] || [ "$(wc -l <<< "$compose_image")" -ne 1 ] || [ "$compose_image" != "$ci_image" ]; then
                      echo "::error file=.github/workflows/ci.yml::the postgres service image must equal the postgres image in billing/compose.yaml"
                      exit 1
                  fi
                  if [ "$compose_image" != "$prod_image" ]; then
                      echo "::error file=deploy/compose.prod.yaml::the postgres image must equal the postgres image in billing/compose.yaml"
                      exit 1
                  fi

            - name: Lockfiles in sync and audits (before install)
              if: steps.changes.outputs.code == 'true'
              run: |
                  composer validate --no-check-publish
                  composer audit --locked
                  npm audit --audit-level=high --package-lock-only

            - name: Dependency cooldown and pinning (before install)
              if: steps.changes.outputs.code == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
                  GITHUB_TOKEN: ${{ github.token }}
                  EVENT: ${{ github.event_name }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  REPOSITORY: ${{ github.repository }}
                  BASE: ${{ steps.changes.outputs.base }}
              run: |
                  # The label is read at run time (re-runs pick it up); only name@version items listed as
                  # "Security-Exception: ..." lines in the PR body are waived, and only for the cooldown.
                  if [ "$EVENT" = pull_request ] \
                      && gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json labels --jq '.labels[].name' | grep -qx security-exception; then
                      DEPENDENCY_AGE_EXCEPTIONS=$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json body --jq .body | grep -iE '^\s*Security-Exception:' || true)
                      export DEPENDENCY_AGE_EXCEPTIONS
                      echo "security-exception label present; listed: ${DEPENDENCY_AGE_EXCEPTIONS:-<none>}"
                  fi
                  if [ "$BASE" = --all ]; then
                      node scripts/check-dependency-age.mjs --all
                  else
                      node scripts/check-dependency-age.mjs --base="$BASE"
                  fi

            - name: Install dependencies
              uses: ./.github/actions/setup-app
              with:
                  node: 'true'

            - name: vp check (format + lint)
              run: npx vp check

            - name: Image sizes (docs screenshots, 500 KB max)
              run: npm run images:check

            - name: Pint
              if: steps.changes.outputs.code == 'true'
              run: vendor/bin/pint --parallel --test

            - name: TypeScript
              if: steps.changes.outputs.code == 'true'
              run: npx tsc --noEmit

            - name: Vitest
              if: steps.changes.outputs.code == 'true'
              # Vitest boots through vite.config.ts; laravel-vite-plugin refuses its dev-server mode on CI otherwise.
              env:
                  LARAVEL_BYPASS_ENV_CHECK: '1'
              run: npm test

            - name: Cache PHPStan results
              if: steps.changes.outputs.code == 'true'
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: billing/storage/framework/cache/phpstan
                  key: phpstan-${{ runner.os }}-${{ hashFiles('billing/composer.lock', 'billing/phpstan.neon') }}-${{ github.run_id }}
                  restore-keys: |
                      phpstan-${{ runner.os }}-${{ hashFiles('billing/composer.lock', 'billing/phpstan.neon') }}-
                      phpstan-${{ runner.os }}-

            - name: PHPStan
              if: steps.changes.outputs.code == 'true'
              run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress --error-format=github

            - name: Pest (SQLite)
              if: steps.changes.outputs.code == 'true'
              run: vendor/bin/pest --parallel

            - name: Migrate, seed and Pest (PostgreSQL)
              if: steps.changes.outputs.code == 'true'
              run: composer test:pgsql

            - name: Build
              if: steps.changes.outputs.code == 'true'
              run: npm run build

            # Last, because it removes the dev dependencies from this job's vendor directory (ADR 0016 §5, guarantee 1).
            - name: The app runs without the dev-only simulators package
              if: steps.changes.outputs.code == 'true'
              # bash -eo pipefail, and the command list is captured first, so a crash of artisan itself fails the step.
              shell: bash
              run: |
                  composer install --no-dev --no-interaction --no-progress
                  commands="$(php artisan list --raw)"
                  if grep -q '^simulate:' <<< "$commands"; then
                      echo '::error::simulate:* commands are available without the dev dependencies'
                      exit 1
                  fi
                  php -r 'require "vendor/autoload.php"; exit(class_exists("Mohar\\Simulators\\SimulatorRegistry") ? 1 : 0);'
