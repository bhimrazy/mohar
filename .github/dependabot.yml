# Supply-chain rule: only adopt versions published at least 14 days ago (cooldown below).
# Not covered: the `services:` image in .github/workflows/ci.yml — CI asserts it equals compose.yaml,
# so bump it by hand in the same PR as Dependabot's compose.yaml update.
version: 2
updates:
    - package-ecosystem: github-actions
      directories:
          - /
          - /.github/actions/*
      target-branch: develop
      schedule:
          interval: weekly
      cooldown:
          default-days: 14
      groups:
          github-actions:
              patterns:
                  - '*'

    - package-ecosystem: docker-compose
      directory: /billing
      target-branch: develop
      schedule:
          interval: weekly
      cooldown:
          default-days: 14

    - package-ecosystem: composer
      directory: /billing
      target-branch: develop
      schedule:
          interval: weekly
      cooldown:
          default-days: 14
      open-pull-requests-limit: 5

    - package-ecosystem: npm
      directory: /billing
      target-branch: develop
      schedule:
          interval: weekly
      cooldown:
          default-days: 14
      open-pull-requests-limit: 5
