# Single CI source of truth for the billing app (the Laravel project lives in billing/).
# Design (billing/docs/devops/ci.md): the repository is public, so runner minutes are free and wall time is what
# counts. The `checks` job runs the policy checks before anything is installed, then lint, types and static analysis
# (about a minute), so a cheap failure fails fast; the test suites (SQLite in 2 shards, PostgreSQL in 3) and the build
# start only after it passed, in parallel. The last job carries the required check's name and passes only when every
# job did. The E2E simulators job is opt-in (manual dispatch, pushes to main, PRs labelled `e2e`): it never runs on
# ordinary PR events, and it is not a required check. Docs/image-only PRs and pushes (Markdown, images, billing/docs/,
# the documentation site in docs-site/) run only the formatter and skip the test and build jobs, so the required check
# still reports. The docs site is never built here. A change to docs-site's own dependency files still runs the policy
# checks. Draft PRs run only when labelled `ci`; feature-branch pushes do not run.
#
# Every third-party action and image is pinned to a commit SHA / digest and must be at least
# MIN_RELEASE_AGE_DAYS old (billing/docs/devops/dependency-policy.md). Dependabot (14-day cooldown)
# updates the actions and billing/compose.yaml images; it does NOT update `services:` images here, so
# CI fails when the postgres service image drifts from compose.yaml.
name: CI

on:
    # Pushes to develop and main run every job, so every merge is tested on the commit that actually landed.
    # A merged PR therefore runs CI twice (its PR run, then the push run); see billing/docs/devops/ci.md.
    push:
        branches:
            - main
            - develop
    pull_request:
        branches:
            - main
            - develop
        types: [opened, synchronize, reopened, ready_for_review, labeled]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    # Draft and ready runs use separate groups: a skipped draft run (e.g. a push landing just after
    # "Ready for review") must never cancel the real run.
    # Adding any other label (e.g. deploy-smoke) starts a run that is skipped; it gets a group of its own so it never
    # cancels the real run.
    group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.event.action == 'labeled' && github.event.label.name != 'ci') && format('label-{0}', github.run_id) || ((github.event.pull_request.draft && !contains(github.event.pull_request.labels.*.name, 'ci')) && 'draft' || 'ready') }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
    run:
        working-directory: billing

env:
    XDEBUG_MODE: 'off'
    MIN_RELEASE_AGE_DAYS: '7'

jobs:
    checks:
        name: Checks (policy, lint, types, static)
        # Drafts skip CI unless labelled `ci` (then PostgreSQL runs before review, not only at merge time).
        # A `labeled` event only runs when the label added is `ci`.
        if: >-
            github.event_name != 'pull_request' ||
            (github.event.action == 'labeled' && github.event.label.name == 'ci') ||
            (github.event.action != 'labeled' && (github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'ci')))
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        outputs:
            code: ${{ steps.changes.outputs.code }}
        permissions:
            contents: read
            pull-requests: read # read the security-exception label at run time (re-runs pick it up)
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  # PR: HEAD^1 of the merge commit is the base. Push: full history so github.event.before is present.
                  fetch-depth: ${{ github.event_name == 'push' && 0 || 2 }}

            - name: Detect docs-only change and diff base
              id: changes
              env:
                  EVENT: ${{ github.event_name }}
                  BEFORE: ${{ github.event.before }}
              run: |
                  code=true
                  deps=false
                  audit=true
                  base=--all
                  files=""
                  if [ "$EVENT" = pull_request ]; then
                      base=HEAD^1
                      files=$(git diff --name-only HEAD^1 HEAD)
                  elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
                      && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                      base=$BEFORE
                      files=$(git diff --name-only "$BEFORE" HEAD)
                  fi
                  # Docs-only: Markdown, images, billing/docs/ and the documentation site. The site's dependency files
                  # (package.json, lockfile, .npmrc, .nvmrc) still need the policy checks: they set deps=true.
                  docs='(\.md$|\.png$|^billing/docs/|^docs-site/)'
                  site_deps='^docs-site/(package\.json|package-lock\.json|\.npmrc|\.nvmrc)$'
                  if [ -n "$files" ] && [ -z "$(grep -vE "$docs" <<< "$files")" ]; then
                      code=false
                      if grep -qE "$site_deps" <<< "$files"; then
                          deps=true
                      fi
                  fi
                  # Advisory audits (owner decision 2026-10-21): they block only a change to a manifest, a lockfile,
                  # .npmrc or the workflow files, so a new advisory against an unchanged lockfile no longer turns
                  # every open PR red; it surfaces on the next dependency change or a manual `composer deps:check`.
                  # With no file list (manual run, new branch) the audits run.
                  if [ -n "$files" ]; then
                      audit_paths='^(billing/(composer\.(json|lock)|package(-lock)?\.json)|docs-site/package(-lock)?\.json|(.*/)?\.npmrc|\.github/workflows/.+)$'
                      if grep -qE "$audit_paths" <<< "$files"; then audit=true; else audit=false; fi
                  fi
                  {
                      echo "code=$code"
                      echo "deps=$deps"
                      echo "audit=$audit"
                      echo "base=$base"
                  } >> "$GITHUB_OUTPUT"
                  echo "Code changes: $code · docs-site dependency changes: $deps · audits: $audit · dependency diff base: $base"

            # ADR 0027: entries go in fragments, never straight into the two changelogs. PRs only, on the docs-only fast
            # path too; git and awk only. HEAD^2 is the PR head (the merge commit's second parent), which carries the
            # assemble marker.
            - name: Changelog fragments
              if: github.event_name == 'pull_request'
              env:
                  BASE_REF: ${{ github.base_ref }}
                  HEAD_REF: ${{ github.head_ref }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
              run: ../scripts/changelog-check.sh --marker-rev HEAD^2 HEAD^1 HEAD

            - name: Set up PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: '8.4'
                  tools: composer:2.10.3
                  extensions: gd, pdo_sqlite, pdo_pgsql, pgsql
                  coverage: none

            - name: Set up Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: billing/.nvmrc
                  cache: npm
                  cache-dependency-path: billing/package-lock.json

            - name: Postgres image matches compose.yaml
              if: steps.changes.outputs.code == 'true'
              run: |
                  pattern='postgres:[0-9.]+-alpine[0-9.]*@sha256:[0-9a-f]{64}'
                  compose_image=$(grep -Eo "$pattern" compose.yaml | sort -u)
                  ci_image=$(grep -Eo "$pattern" ../.github/workflows/ci.yml | sort -u)
                  prod_image=$(grep -Eo "$pattern" ../deploy/compose.prod.yaml 2>/dev/null | sort -u)
                  echo "compose.yaml:      ${compose_image:-<none>}"
                  echo "ci.yml:            ${ci_image:-<none>}"
                  echo "compose.prod.yaml: ${prod_image:-<none>}"
                  if [ -z "$compose_image" ] || [ "$(wc -l <<< "$compose_image")" -ne 1 ] || [ "$compose_image" != "$ci_image" ]; then
                      echo "::error file=.github/workflows/ci.yml::the postgres service image must equal the postgres image in billing/compose.yaml"
                      exit 1
                  fi
                  if [ "$compose_image" != "$prod_image" ]; then
                      echo "::error file=deploy/compose.prod.yaml::the postgres image must equal the postgres image in billing/compose.yaml"
                      exit 1
                  fi

            - name: Lockfiles in sync (before install)
              if: steps.changes.outputs.code == 'true' || steps.changes.outputs.deps == 'true'
              run: composer validate --no-check-publish

            # Only when a manifest, lockfile, .npmrc or workflow file changed (detect step above).
            - name: Security audits (before install)
              if: steps.changes.outputs.audit == 'true'
              run: |
                  composer audit --locked
                  npm audit --audit-level=high --package-lock-only
                  # The documentation site's lockfile (docs-site/), audited without installing it.
                  (cd ../docs-site && npm audit --audit-level=high --package-lock-only)

            - name: Dependency cooldown and pinning (before install)
              if: steps.changes.outputs.code == 'true' || steps.changes.outputs.deps == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
                  GITHUB_TOKEN: ${{ github.token }}
                  EVENT: ${{ github.event_name }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  REPOSITORY: ${{ github.repository }}
                  BASE: ${{ steps.changes.outputs.base }}
              run: |
                  # The label is read at run time (re-runs pick it up); only name@version items listed as
                  # "Security-Exception: ..." lines in the PR body are waived, and only for the cooldown.
                  if [ "$EVENT" = pull_request ] \
                      && gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json labels --jq '.labels[].name' | grep -qx security-exception; then
                      DEPENDENCY_AGE_EXCEPTIONS=$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json body --jq .body | grep -iE '^\s*Security-Exception:' || true)
                      export DEPENDENCY_AGE_EXCEPTIONS
                      echo "security-exception label present; listed: ${DEPENDENCY_AGE_EXCEPTIONS:-<none>}"
                  fi
                  if [ "$BASE" = --all ]; then
                      node scripts/check-dependency-age.mjs --all
                  else
                      node scripts/check-dependency-age.mjs --base="$BASE"
                  fi

            - name: Install dependencies
              uses: ./.github/actions/setup-app
              with:
                  node: 'true'

            - name: vp check (format + lint)
              run: npx vp check

            - name: Image sizes (docs screenshots, 500 KB max)
              run: npm run images:check

            - name: Cache tool results (PHPStan, Pint, tsc)
              if: steps.changes.outputs.code == 'true'
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  # Each tool validates its own cache (file content hashes, tool version, config), so restoring an
                  # older entry is safe; a new entry is saved every run so the next one starts from the latest.
                  path: |
                      billing/storage/framework/cache/phpstan
                      billing/storage/framework/cache/pint.cache
                      billing/storage/framework/cache/tsc.tsbuildinfo
                  key: tools-${{ runner.os }}-${{ hashFiles('billing/composer.lock', 'billing/package-lock.json') }}-${{ github.run_id }}
                  restore-keys: |
                      tools-${{ runner.os }}-${{ hashFiles('billing/composer.lock', 'billing/package-lock.json') }}-
                      tools-${{ runner.os }}-

            - name: Pint
              if: steps.changes.outputs.code == 'true'
              run: vendor/bin/pint --parallel --test --cache-file=storage/framework/cache/pint.cache

            - name: TypeScript
              if: steps.changes.outputs.code == 'true'
              run: npx tsc --noEmit --incremental --tsBuildInfoFile storage/framework/cache/tsc.tsbuildinfo

            - name: Vitest
              if: steps.changes.outputs.code == 'true'
              # Vitest boots through vite.config.ts; laravel-vite-plugin refuses its dev-server mode on CI otherwise.
              env:
                  LARAVEL_BYPASS_ENV_CHECK: '1'
              run: npm test

            - name: PHPStan
              if: steps.changes.outputs.code == 'true'
              run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress --error-format=github

    # Pest's --shard splits the test files round-robin; each shard is a full `--parallel` run of its share.
    sqlite:
        name: Pest SQLite (${{ matrix.shard }}/2)
        needs: checks
        # The policy checks passed before any of these jobs installs or runs code; docs-only changes skip them.
        if: needs.checks.outputs.code == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2]
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: '8.4'
                  tools: composer:2.10.3
                  extensions: gd, pdo_sqlite, pdo_pgsql, pgsql
                  coverage: none

            # Node runs scripts/slowest-tests.mjs; no npm dependencies are installed.
            - name: Set up Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: billing/.nvmrc

            - name: Install dependencies
              uses: ./.github/actions/setup-app

            - name: Pest (SQLite)
              env:
                  SHARD: ${{ matrix.shard }}/2
              run: |
                  vendor/bin/pest --parallel --shard="$SHARD" --log-junit="$RUNNER_TEMP/sqlite.xml"
                  node scripts/slowest-tests.mjs "$RUNNER_TEMP/sqlite.xml"

    pgsql:
        name: Pest PostgreSQL (${{ matrix.shard }}/3)
        needs: checks
        # The policy checks passed before any of these jobs installs or runs code; docs-only changes skip them.
        if: needs.checks.outputs.code == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3]
        services:
            postgres:
                # Must equal the postgres image in billing/compose.yaml (asserted in the checks job).
                image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
                env:
                    POSTGRES_DB: billing_test
                    POSTGRES_USER: billing
                    POSTGRES_PASSWORD: billing
                    # Throwaway database reachable only from this job: no SCRAM handshake on each test's new connection.
                    POSTGRES_HOST_AUTH_METHOD: trust
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U billing -d billing_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: '8.4'
                  tools: composer:2.10.3
                  extensions: gd, pdo_sqlite, pdo_pgsql, pgsql
                  coverage: none

            # Node runs scripts/slowest-tests.mjs; no npm dependencies are installed.
            - name: Set up Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: billing/.nvmrc

            - name: Install dependencies
              uses: ./.github/actions/setup-app

            - name: Tune PostgreSQL for throwaway data
              env:
                  CONTAINER: ${{ job.services.postgres.id }}
              run: |
                  # Durability is irrelevant for a database that is discarded after the run (all three are reloadable).
                  docker exec "$CONTAINER" psql -U billing -d billing_test -qc 'ALTER SYSTEM SET fsync = off' \
                      -c 'ALTER SYSTEM SET synchronous_commit = off' -c 'ALTER SYSTEM SET full_page_writes = off' \
                      -c 'SELECT pg_reload_conf()'
                  docker exec "$CONTAINER" psql -U billing -d billing_test -tAc 'SHOW fsync' -c 'SHOW synchronous_commit' -c 'SHOW full_page_writes'
                  # Connect to the container on the job network instead of the published port: localhost:5432 goes
                  # through docker-proxy, which roughly doubles the latency of every query.
                  ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$CONTAINER")
                  echo "PostgreSQL container: $ip:5432"
                  {
                      echo "DB_HOST=$ip"
                      echo "DB_PORT=5432"
                  } >> "$GITHUB_ENV"

            - name: Pest (PostgreSQL)
              env:
                  # The suite is round-trip bound on PostgreSQL (workers mostly wait on the database), so it runs more
                  # workers than the 2 vCPUs; each stays under the 1 GB memory_limit in phpunit.xml.
                  PEST_PROCESSES: '4'
                  SHARD: ${{ matrix.shard }}/3
              run: |
                  read -r _ u1 n1 s1 i1 w1 _ < /proc/stat
                  composer test:pgsql -- --shard="$SHARD" --log-junit="$RUNNER_TEMP/pgsql.xml"
                  read -r _ u2 n2 s2 i2 w2 _ < /proc/stat
                  busy=$(( (u2 + n2 + s2) - (u1 + n1 + s1) )); idle=$(( (i2 + w2) - (i1 + w1) ))
                  echo "CPU busy during the suite: $(( 100 * busy / (busy + idle) ))% of $(nproc) vCPUs"
                  node scripts/slowest-tests.mjs "$RUNNER_TEMP/pgsql.xml"

    build:
        name: Build
        needs: checks
        # The policy checks passed before any of these jobs installs or runs code; docs-only changes skip them.
        if: needs.checks.outputs.code == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: '8.4'
                  tools: composer:2.10.3
                  extensions: gd, pdo_sqlite, pdo_pgsql, pgsql
                  coverage: none

            - name: Set up Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: billing/.nvmrc
                  cache: npm
                  cache-dependency-path: billing/package-lock.json

            - name: Install dependencies
              uses: ./.github/actions/setup-app
              with:
                  node: 'true'

            - name: Build
              run: npm run build

            # Last, because it removes the dev dependencies from this job's vendor directory (ADR 0016 §5, guarantee 1).
            - name: The app runs without the dev-only simulators package
              # bash -eo pipefail, and the command list is captured first, so a crash of artisan itself fails the step.
              shell: bash
              run: |
                  composer install --no-dev --no-interaction --no-progress
                  commands="$(php artisan list --raw)"
                  if grep -q '^simulate:' <<< "$commands"; then
                      echo '::error::simulate:* commands are available without the dev dependencies'
                      exit 1
                  fi
                  php -r 'require "vendor/autoload.php"; exit(class_exists("Mohar\\Simulators\\SimulatorRegistry") ? 1 : 0);'

    # The required status check (branch protection on develop and main): it passes only when the checks job passed and
    # every test and build job passed, or, on a docs-only change, was skipped. always() so a failed, cancelled or
    # timed-out job still reports a failure here instead of a skipped (= passing) check.
    ci:
        name: CI (policy, lint, types, static, tests, build)
        needs: [checks, sqlite, pgsql, build]
        if: >-
            always() && (
                github.event_name != 'pull_request' ||
                (github.event.action == 'labeled' && github.event.label.name == 'ci') ||
                (github.event.action != 'labeled' && (github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'ci')))
            )
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        permissions: {}
        defaults:
            run:
                working-directory: .
        steps:
            - name: Every job passed
              env:
                  CHECKS: ${{ needs.checks.result }}
                  CODE: ${{ needs.checks.outputs.code }}
                  SQLITE: ${{ needs.sqlite.result }}
                  PGSQL: ${{ needs.pgsql.result }}
                  BUILD: ${{ needs.build.result }}
              run: |
                  echo "checks: $CHECKS (code changes: ${CODE:-?}) · sqlite: $SQLITE · pgsql: $PGSQL · build: $BUILD"
                  if [ "$CHECKS" != success ]; then
                      echo "::error::the checks job did not pass ($CHECKS)"
                      exit 1
                  fi
                  want=skipped
                  if [ "$CODE" = true ]; then want=success; fi
                  for job in "sqlite:$SQLITE" "pgsql:$PGSQL" "build:$BUILD"; do
                      if [ "${job#*:}" != "$want" ]; then
                          echo "::error::${job%%:*} is ${job#*:}, expected $want"
                          exit 1
                      fi
                  done

    # ADR 0016 §4-5: the end-to-end hosting scenario against the whm, stripe, khalti and esewa simulators, on a throwaway PostgreSQL
    # database. Its own job and check name, so a simulator failure never hides a main-suite failure. Opt-in, about
    # 2 billable minutes a run: manual dispatch (the CTO's develop run after a batch of merges counts towards the
    # 10 consecutive green runs), pushes to main, and PRs labelled `e2e`. Never on ordinary PR events, and not a
    # required check. The test jobs never run tests/Simulators.
    e2e-simulators:
        name: E2E simulators (hosting lifecycle)
        if: >-
            github.event_name == 'workflow_dispatch' ||
            (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
            (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'e2e')
                && (github.event.action != 'labeled' || github.event.label.name == 'e2e'))
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        services:
            postgres:
                # Must equal the postgres image in billing/compose.yaml (the checks job asserts it).
                image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
                env:
                    POSTGRES_DB: billing_test
                    POSTGRES_USER: billing
                    POSTGRES_PASSWORD: billing
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U billing -d billing_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: '8.4'
                  tools: composer:2.10.3
                  extensions: gd, pdo_sqlite, pdo_pgsql, pgsql
                  coverage: none

            # The main job runs the lockfile, audit and cooldown checks; this one installs the same locked versions.
            - name: Install dependencies
              uses: ./.github/actions/setup-app

            - name: Hosting lifecycle against the simulators (6-minute budget)
              env:
                  APP_ENV: testing
                  DB_HOST: 127.0.0.1
                  DB_PORT: '5432'
                  DB_DATABASE: billing_test
                  DB_USERNAME: billing
                  DB_PASSWORD: billing
              run: php artisan simulate:e2e --connection=pgsql --budget=360
