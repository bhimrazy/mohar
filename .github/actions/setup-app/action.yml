name: Set up billing app
description: >-
    Install Composer dependencies (cached), optionally npm dependencies and Wayfinder routes, and prepare .env.
    The caller sets up PHP and Node first and runs the dependency policy checks before this action, so no
    package code executes before the lockfiles are approved.

inputs:
    node:
        description: Also install npm dependencies and generate Wayfinder routes.
        required: false
        default: 'false'

runs:
    using: composite
    steps:
        - name: Locate Composer cache
          id: composer-cache
          shell: bash
          working-directory: billing
          run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

        - name: Cache Composer downloads
          uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          with:
              path: ${{ steps.composer-cache.outputs.dir }}
              key: composer-${{ runner.os }}-${{ hashFiles('billing/composer.lock') }}
              restore-keys: composer-${{ runner.os }}-

        - name: Install Composer dependencies
          shell: bash
          working-directory: billing
          run: composer install --no-interaction --no-progress --prefer-dist

        - name: Prepare environment
          shell: bash
          working-directory: billing
          run: |
              cp .env.example .env
              php artisan key:generate --ansi

        - name: Install npm dependencies
          if: inputs.node == 'true'
          shell: bash
          working-directory: billing
          run: npm ci --no-audit --no-fund

        - name: Generate Wayfinder routes
          if: inputs.node == 'true'
          shell: bash
          working-directory: billing
          run: php artisan wayfinder:generate --with-form
