# Nightly advisory audit of the lockfiles (owner decision 2026-10-21, billing/docs/devops/dependency-policy.md).
# CI audits only run on a change to a manifest, a lockfile, .npmrc or the workflow files, so a newly published
# advisory never turns every open PR red. This workflow catches the advisories that arrive later: it runs the same
# audits as CI, and on failure opens an issue (or comments on the open one with the same title) labelled `security`
# and `go-live`. It never installs project dependencies and has no secrets beyond the job's GITHUB_TOKEN.
name: Security audit

on:
    schedule:
        # 02:17 UTC every day (07:59 in Nepal): quiet, and off the top of the hour where scheduled runs queue up.
        - cron: '17 2 * * *'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: security-audit
    cancel-in-progress: false

env:
    ISSUE_TITLE: 'Security audit: advisory found in dependencies'

jobs:
    audit:
        name: Audit lockfiles (composer, npm)
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: read
            issues: write
        defaults:
            run:
                working-directory: billing
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: '8.4'
                  tools: composer:2.10.3
                  coverage: none

            - name: Set up Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: billing/.nvmrc

            # The same commands as the CI step "Security audits (before install)"; nothing is installed. A brace
            # group (not a pipeline) keeps `failed` in this shell; every command runs even when an earlier one fails.
            - name: Audit lockfiles
              id: audit
              run: |
                  failed=false
                  {
                      echo '$ composer audit --locked'
                      composer audit --locked || failed=true
                      echo
                      echo '$ npm audit --audit-level=high --package-lock-only   (billing/)'
                      npm audit --audit-level=high --package-lock-only || failed=true
                      echo
                      echo '$ npm audit --audit-level=high --package-lock-only   (docs-site/)'
                      (cd ../docs-site && npm audit --audit-level=high --package-lock-only) || failed=true
                  } > "$RUNNER_TEMP/audit.log" 2>&1
                  cat "$RUNNER_TEMP/audit.log"
                  echo "failed=$failed" >> "$GITHUB_OUTPUT"

            - name: Open or update the issue
              if: steps.audit.outputs.failed == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  # GitHub caps a body at 65,536 characters; keep the head of the log, which names the packages.
                  {
                      echo "The nightly audit of the lockfiles found an advisory. Run: $RUN_URL"
                      echo
                      echo 'Fix it with a dependency bump that follows ADR 0007 (exact pin, 7-day cooldown), or the'
                      echo 'documented Security-Exception route in billing/docs/devops/dependency-policy.md.'
                      echo
                      echo '```text'
                      head -c 50000 "$RUNNER_TEMP/audit.log"
                      echo
                      echo '```'
                  } > "$RUNNER_TEMP/body.md"
                  # Only labels that exist in the repository are attached (a missing label would fail the command).
                  repo_labels=$(gh label list --limit 200 --json name --jq '.[].name')
                  labels=()
                  for label in security go-live; do
                      if grep -qx "$label" <<< "$repo_labels"; then
                          labels+=(--label "$label")
                      fi
                  done
                  existing=$(gh issue list --state open --limit 100 --json number,title \
                      --jq "[.[] | select(.title == \"$ISSUE_TITLE\")] | first | .number // empty")
                  if [ -n "$existing" ]; then
                      gh issue comment "$existing" --body-file "$RUNNER_TEMP/body.md"
                      echo "Commented on issue #$existing"
                  else
                      gh issue create --title "$ISSUE_TITLE" --body-file "$RUNNER_TEMP/body.md" "${labels[@]}"
                  fi

            # The run itself turns red too, so the failure shows in the Actions list and in notifications.
            - name: Fail when an advisory was found
              if: steps.audit.outputs.failed == 'true'
              run: |
                  echo '::error::the lockfile audit found an advisory; see the issue titled "'"$ISSUE_TITLE"'"'
                  exit 1
