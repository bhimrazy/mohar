# Manual load test of the production stack on a GitHub-hosted runner (loadtest/README.md): build the image, start
# the stack under a host profile's CPU and memory caps, seed, warm up, run the k6 levels, time the billing-day
# automation, PDFs and the queue drain, and upload the results (JSON plus summary.md) as an artifact. Never part of
# the normal CI job and never automatic: the codespace cannot network containers, so this is where it runs.
#
# Runs only when started by hand:
# - Actions -> Load test -> Run workflow (available once this file is on the default branch), or
# - adding the `load-test` label to a pull request: the runs in the PR's loadtest/label-runs.json (at most three;
#   profile, levels, durations, arrival spread and think time), checked by loadtest/bin/plan.py. Remove and re-add
#   the label to run again. Only people with triage access can add a label. The label path always uses the
#   ubuntu-24.04 runner and --require-fit; the file cannot choose either.
#
# The standard Linux runner has 4 CPUs and 16 GB for a public repository (2 CPUs and 8 GB for a private one), which
# fits the small and medium profiles. A profile larger than the runner is skipped unless `allow_smaller_runner` is
# set (then the numbers describe the runner, and the summary says so). Point `runner` at a larger runner label to
# measure large for real.
name: Load test

on:
    workflow_dispatch:
        inputs:
            profile:
                description: Host profile (loadtest/profiles), or all three
                type: choice
                options: [small, medium, large, all]
                default: small
            volume:
                description: Seed volume (large = 50,000 clients and 100,000 services)
                type: choice
                options: [tiny, small, medium, large]
                default: large
            levels:
                description: Virtual users per step, space-separated (empty = the profile's)
                type: string
                default: ''
            level_duration:
                description: Duration of each step, e.g. 90s or 2m (empty = the profile's)
                type: string
                default: ''
            runner:
                description: Runner label
                type: string
                default: ubuntu-24.04
            allow_smaller_runner:
                description: Run a profile even when the runner is smaller than it
                type: boolean
                default: false
    pull_request:
        types: [labeled]

permissions:
    contents: read

concurrency:
    # A `load-test` label shares one group per pull request, so re-labelling cancels the superseded run of that PR.
    # Every other run gets a group of its own (the run id): a second dispatch never cancels a running one, and any
    # other label added to the PR during a load test never cancels it.
    group: load-test-${{ (github.event_name == 'pull_request' && github.event.label.name == 'load-test') && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
    cancel-in-progress: true

jobs:
    plan:
        name: Plan
        # A `labeled` event runs only when the label added is `load-test`.
        if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'load-test'
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        outputs:
            runs: ${{ steps.plan.outputs.runs }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Plan
              id: plan
              env:
                  EVENT: ${{ github.event_name }}
                  INPUT_PROFILE: ${{ inputs.profile }}
                  INPUT_VOLUME: ${{ inputs.volume }}
                  INPUT_LEVELS: ${{ inputs.levels }}
                  INPUT_LEVEL_DURATION: ${{ inputs.level_duration }}
              run: |
                  if [ "$EVENT" = workflow_dispatch ]; then
                      runs="$(python3 loadtest/bin/plan.py --dispatch)"
                  else
                      runs="$(python3 loadtest/bin/plan.py --label loadtest/label-runs.json)"
                  fi
                  echo "$runs" | python3 -m json.tool
                  echo "runs=$runs" >> "$GITHUB_OUTPUT"

    load:
        name: Load test (${{ matrix.name }})
        needs: plan
        # The runner comes from the dispatch input only; a pull request always gets the standard runner.
        runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'ubuntu-24.04' }}
        # A ramp of 8 levels of 5 minutes plus build, seed and background work stays near 70 minutes.
        timeout-minutes: 150
        strategy:
            fail-fast: false
            matrix:
                include: ${{ fromJSON(needs.plan.outputs.runs) }}
        env:
            PROFILE: ${{ matrix.profile }}
            VOLUME: ${{ matrix.volume }}
            LEVELS: ${{ matrix.levels }}
            LEVEL_DURATION: ${{ matrix.level_duration }}
            START_SPREAD: ${{ matrix.start_spread }}
            WARMUP: ${{ matrix.warmup }}
            THINK: ${{ matrix.think }}
            ALLOW_SMALLER: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_smaller_runner && '1' || '' }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Runner
              run: |
                  echo "$(nproc) CPUs, $(awk '/MemTotal/ { printf "%d MB", $2 / 1024 }' /proc/meminfo)"
                  docker info --format 'Docker Engine {{.ServerVersion}}, cgroup driver {{.CgroupDriver}}, cgroup v{{.CgroupVersion}}'
                  docker compose version

            - name: Load test
              env:
                  # The runner context exists in step env, not job env.
                  LOADTEST_RESULTS_DIR: ${{ runner.temp }}/loadtest
              run: |
                  args=(--profile "$PROFILE" --volume "$VOLUME")
                  [ -n "$LEVELS" ] && args+=(--levels "$LEVELS")
                  [ -n "$LEVEL_DURATION" ] && args+=(--level-duration "$LEVEL_DURATION")
                  [ -n "$START_SPREAD" ] && args+=(--start-spread "$START_SPREAD")
                  [ -n "$WARMUP" ] && args+=(--warmup "$WARMUP")
                  [ -n "$THINK" ] && args+=(--think "$THINK")
                  [ -z "$ALLOW_SMALLER" ] && args+=(--require-fit)
                  loadtest/bin/run "${args[@]}"

            - name: Upload results
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: load-test-${{ matrix.name }}-${{ matrix.volume }}-${{ github.run_id }}
                  path: ${{ runner.temp }}/loadtest
                  if-no-files-found: warn
                  retention-days: 30
