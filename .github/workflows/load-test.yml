# Manual load test of the production stack on a GitHub-hosted runner (loadtest/README.md): build the image, start
# the stack under a host profile's CPU and memory caps, seed, warm up, run the k6 levels, time the billing-day
# automation, PDFs and the queue drain, and upload the results (JSON plus summary.md) as an artifact. Never part of
# the normal CI job and never automatic: the codespace cannot network containers, so this is where it runs.
#
# Runs only when started by hand:
# - Actions -> Load test -> Run workflow (available once this file is on the default branch), or
# - adding the `load-test` label to a pull request: small profile, large volume (remove and re-add it to run again).
#
# A private repository's standard Linux runner has 2 CPUs and 8 GB, which fits only the small profile; medium and
# large are skipped there unless `allow_smaller_runner` is set (then the numbers describe the runner, and the
# summary says so). Point `runner` at a larger runner label to measure them for real.
name: Load test

on:
    workflow_dispatch:
        inputs:
            profile:
                description: Host profile (loadtest/profiles), or all three
                type: choice
                options: [small, medium, large, all]
                default: small
            volume:
                description: Seed volume (large = 50,000 clients and 100,000 services)
                type: choice
                options: [tiny, small, medium, large]
                default: large
            levels:
                description: Virtual users per step, space-separated (empty = the profile's)
                type: string
                default: ''
            level_duration:
                description: Duration of each step, e.g. 90s or 2m (empty = the profile's)
                type: string
                default: ''
            runner:
                description: Runner label
                type: string
                default: ubuntu-24.04
            allow_smaller_runner:
                description: Run a profile even when the runner is smaller than it
                type: boolean
                default: false
    pull_request:
        types: [labeled]

permissions:
    contents: read

concurrency:
    # Any label added to the PR starts this workflow; only `load-test` runs it. Other labels get a group of their
    # own, so labelling a PR during a load test never cancels it.
    group: load-test-${{ github.event.pull_request.number || github.ref }}-${{ (github.event_name == 'pull_request' && github.event.label.name != 'load-test') && github.run_id || 'run' }}
    cancel-in-progress: true

jobs:
    load:
        name: Load test (${{ matrix.profile }})
        # A `labeled` event runs only when the label added is `load-test`.
        if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'load-test'
        runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
        timeout-minutes: 120
        strategy:
            fail-fast: false
            matrix:
                profile: ${{ fromJSON((inputs.profile || 'small') == 'all' && '["small","medium","large"]' || format('["{0}"]', inputs.profile || 'small')) }}
        env:
            PROFILE: ${{ matrix.profile }}
            VOLUME: ${{ inputs.volume || 'large' }}
            LEVELS: ${{ inputs.levels }}
            LEVEL_DURATION: ${{ inputs.level_duration }}
            ALLOW_SMALLER: ${{ inputs.allow_smaller_runner && '1' || '' }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Runner
              run: |
                  echo "$(nproc) CPUs, $(awk '/MemTotal/ { printf "%d MB", $2 / 1024 }' /proc/meminfo)"
                  docker info --format 'Docker Engine {{.ServerVersion}}, cgroup driver {{.CgroupDriver}}, cgroup v{{.CgroupVersion}}'
                  docker compose version

            - name: Load test
              env:
                  # The runner context exists in step env, not job env.
                  LOADTEST_RESULTS_DIR: ${{ runner.temp }}/loadtest
              run: |
                  args=(--profile "$PROFILE" --volume "$VOLUME")
                  [ -n "$LEVELS" ] && args+=(--levels "$LEVELS")
                  [ -n "$LEVEL_DURATION" ] && args+=(--level-duration "$LEVEL_DURATION")
                  [ -z "$ALLOW_SMALLER" ] && args+=(--require-fit)
                  loadtest/bin/run "${args[@]}"

            - name: Upload results
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: load-test-${{ matrix.profile }}-${{ inputs.volume || 'large' }}-${{ github.run_id }}
                  path: ${{ runner.temp }}/loadtest
                  if-no-files-found: warn
                  retention-days: 30
