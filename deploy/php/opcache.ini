; Production OPcache: code never changes inside a running container, so timestamps are not checked.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
; Under 16,000 PHP files in the source tree with dev packages (2026-10); OPcache rounds this up to 32,531 slots.
opcache.max_accelerated_files = 20000
opcache.save_comments = 1
