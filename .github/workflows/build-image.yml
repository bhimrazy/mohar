# Manual build of the production image (deploy/Dockerfile, target prod): always a downloadable OCI artifact with an
# SBOM and provenance, a size report, and the release tarball for hosts without Docker (install.md, cpanel.md).
# Pushing to GHCR is an option of the run: it copies the very OCI archive that was built, digest for digest.
# Never part of the normal CI job; runs only from Actions -> Build image -> Run workflow. Pushing to GHCR and drafting a
# release run only from main and only for merged code: a push builds main's head, a release a tag on main. Both jobs
# name the `release` environment, which does not exist yet: GitHub creates a missing environment on first use with no
# protection rules, so it adds nothing until the owner creates it with a main-only branch policy and a required
# reviewer (an owner setting, billing/docs/devops/container-image.md). The cache is scoped to the built ref.
name: Build image

on:
    workflow_dispatch:
        inputs:
            ref:
                description: Branch, tag or commit to build
                type: string
                default: develop
            platforms:
                description: Platforms (arm64 is emulated with QEMU and much slower)
                type: choice
                options: [linux/amd64, linux/arm64, 'linux/amd64,linux/arm64']
                default: linux/amd64
            push_to_ghcr:
                description: Also push the image to ghcr.io/<owner>/<repo>
                type: boolean
                default: false
            release_tag:
                description: Attach the release tarball to a draft GitHub release for this existing tag (must equal ref and be on main; runs from main only)
                type: string
                default: ''
            size_limit_mb:
                description: Fail when one platform's compressed image is larger than this (MB)
                type: number
                default: 250

permissions:
    contents: read

concurrency:
    group: build-image-${{ inputs.ref }}
    cancel-in-progress: false

jobs:
    build:
        name: Build (OCI artifact, SBOM, provenance, release tarball)
        runs-on: ubuntu-24.04
        timeout-minutes: 90
        outputs:
            revision: ${{ steps.meta.outputs.revision }}
            tag: ${{ steps.meta.outputs.tag }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # A release is built from the tag itself, never from a branch of the same name.
                  ref: ${{ inputs.release_tag != '' && format('refs/tags/{0}', inputs.release_tag) || inputs.ref }}
                  persist-credentials: false
                  # Full history (all branches) when publishing, for the check that the built commit is on main. A
                  # string: the number 0 is falsy in an expression and would fall through to 1.
                  fetch-depth: ${{ (inputs.push_to_ghcr || inputs.release_tag != '') && '0' || '1' }}

            - name: Revision
              id: meta
              run: |
                  revision="$(git rev-parse HEAD)"
                  {
                      echo "revision=$revision"
                      echo "tag=${revision:0:12}"
                      echo "created=$(git show -s --format=%cI HEAD)"
                  } >> "$GITHUB_OUTPUT"

            - name: Built commit is merged (GHCR push, release)
              if: inputs.push_to_ghcr || inputs.release_tag != ''
              env:
                  RELEASE_TAG: ${{ inputs.release_tag }}
              run: |
                  # Only merged code is published under the project's name, whatever ref the run was given
                  # (refs/pull/<n>/head included): a GHCR push builds main's head, a release a tag whose commit is on main.
                  built="$(git rev-parse HEAD)"
                  main="$(git rev-parse refs/remotes/origin/main)"
                  if [ -n "$RELEASE_TAG" ]; then
                      git merge-base --is-ancestor "$built" "$main" \
                          || { echo "::error::tag $RELEASE_TAG ($built) is not on main ($main)"; exit 1; }
                  elif [ "$built" != "$main" ]; then
                      echo "::error::a GHCR push builds main's head ($main); this run built $built"
                      exit 1
                  fi
                  echo "Built $built: on main ($main)"

            - name: Set up QEMU (arm64)
              if: contains(inputs.platforms, 'arm64')
              uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
              with:
                  # Pinned instead of the action's default `latest` (ADR 0007): qemu-v10.2.3, pushed 2026-06-08.
                  image: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
                  platforms: arm64

            - name: Set up Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
              with:
                  # The container driver (attestations need it), with BuildKit pinned (ADR 0007): v0.34.0, pushed 2026-10-07.
                  driver: docker-container
                  driver-opts: image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c

            - name: Build the image as an OCI archive
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  file: deploy/Dockerfile
                  target: prod
                  platforms: ${{ inputs.platforms }}
                  tags: mohar-app:${{ steps.meta.outputs.tag }}
                  labels: |
                      org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.created=${{ steps.meta.outputs.created }}
                  # An OCI layout keeps the multi-platform index and the attestations; the classic docker exporter cannot.
                  outputs: type=oci,dest=${{ runner.temp }}/image.tar
                  provenance: mode=max
                  sbom: true
                  cache-from: type=gha,scope=build-image-${{ inputs.ref }}
                  cache-to: type=gha,mode=max,scope=build-image-${{ inputs.ref }}

            - name: Build the release tarball (linux/amd64; the tree is architecture-independent)
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  file: deploy/Dockerfile
                  target: release
                  platforms: linux/amd64
                  outputs: type=tar,dest=${{ runner.temp }}/release.tar
                  provenance: false
                  sbom: false
                  cache-from: type=gha,scope=build-image-${{ inputs.ref }}

            - name: Size report
              env:
                  LIMIT_MB: ${{ inputs.size_limit_mb }}
                  TAG: ${{ steps.meta.outputs.tag }}
                  WORK: ${{ runner.temp }}
              run: |
                  cd "$WORK"
                  gzip -9 -n release.tar
                  mv release.tar.gz "release-$TAG.tar.gz"
                  sha256sum "release-$TAG.tar.gz" > "release-$TAG.tar.gz.sha256"
                  python3 - <<'PY'
                  import json, os, tarfile
                  limit = float(os.environ["LIMIT_MB"]) * 1e6
                  tag, work = os.environ["TAG"], os.environ["WORK"]
                  with tarfile.open(f"{work}/image.tar") as oci:
                      blob = lambda digest: json.load(oci.extractfile("blobs/sha256/" + digest.split(":", 1)[1]))
                      index = json.load(oci.extractfile("index.json"))
                      manifests = []
                      for entry in index["manifests"]:
                          node = blob(entry["digest"])
                          manifests += node.get("manifests", [entry]) if "manifests" in node else [entry]
                      rows, too_big = [], []
                      for entry in manifests:
                          platform = entry.get("platform", {})
                          name = f'{platform.get("os", "?")}/{platform.get("architecture", "?")}'
                          if name == "unknown/unknown":
                              continue  # attestation manifests (SBOM, provenance)
                          layers = blob(entry["digest"])["layers"]
                          size = sum(layer["size"] for layer in layers)
                          rows.append(f"| {name} | {len(layers)} | {size / 1e6:.1f} MB | `{entry['digest'][:19]}` |")
                          if size > limit:
                              too_big.append(name)
                  archive = os.path.getsize(f"{work}/image.tar") / 1e6
                  release = os.path.getsize(f"{work}/release-{tag}.tar.gz") / 1e6
                  summary = "\n".join([
                      f"### Image `mohar-app:{tag}`", "",
                      "| Platform | Layers | Compressed | Manifest |", "| --- | ---: | ---: | --- |", *rows, "",
                      f"OCI archive (all platforms, SBOM and provenance attestations): {archive:.1f} MB.  ",
                      f"Release tarball `release-{tag}.tar.gz`: {release:.1f} MB.", "",
                  ])
                  print(summary)
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
                      out.write(summary + "\n")
                  if too_big:
                      raise SystemExit(f"over the {limit / 1e6:.0f} MB limit: {', '.join(too_big)}")
                  PY

            - name: Upload the OCI image
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: image-${{ steps.meta.outputs.tag }}
                  path: ${{ runner.temp }}/image.tar
                  # The layers are already compressed.
                  compression-level: 0
                  retention-days: 7
                  if-no-files-found: error

            - name: Upload the release tarball
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: release-${{ steps.meta.outputs.tag }}
                  path: |
                      ${{ runner.temp }}/release-${{ steps.meta.outputs.tag }}.tar.gz
                      ${{ runner.temp }}/release-${{ steps.meta.outputs.tag }}.tar.gz.sha256
                  compression-level: 0
                  retention-days: 7
                  if-no-files-found: error

    push:
        name: Push to GHCR
        needs: build
        # The Actions UI offers any branch that contains this file; only a run started from main may hold
        # `packages: write`. The `release` environment protects nothing until the owner creates it (see the top).
        if: inputs.push_to_ghcr && github.ref == 'refs/heads/main'
        environment: release
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        permissions:
            contents: read
            packages: write
        steps:
            - name: Download the OCI image
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: image-${{ needs.build.outputs.tag }}
                  path: ${{ runner.temp }}

            - name: Copy it to ghcr.io (every platform and attestation, digests preserved)
              env:
                  ACTOR: ${{ github.actor }}
                  TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  REPOSITORY: ${{ github.repository }}
                  TAG: ${{ needs.build.outputs.tag }}
                  WORK: ${{ runner.temp }}
              run: |
                  image="ghcr.io/${REPOSITORY,,}:$TAG"
                  skopeo copy --all --preserve-digests --dest-creds "$ACTOR:$TOKEN" \
                      "oci-archive:$WORK/image.tar" "docker://$image"
                  digest="$(skopeo inspect --raw --creds "$ACTOR:$TOKEN" "docker://$image" | sha256sum | cut -d' ' -f1)"
                  {
                      echo "### Pushed"
                      echo
                      echo "\`$image\` (index \`sha256:$digest\`). Deploy it with \`deploy/bin/deploy --image ghcr.io/${REPOSITORY,,}@sha256:$digest\`."
                  } | tee -a "$GITHUB_STEP_SUMMARY"

    release:
        name: Draft release with the tarball
        needs: build
        # Same guards as the GHCR push: only a run from main may hold `contents: write`, and the environment protects
        # nothing until the owner creates it. The tag must be the ref that was built, so the assets are the tagged commit's.
        if: inputs.release_tag != '' && inputs.release_tag == inputs.ref && github.ref == 'refs/heads/main'
        environment: release
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        permissions:
            contents: write
        steps:
            - name: Download the release tarball
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: release-${{ needs.build.outputs.tag }}
                  path: ${{ runner.temp }}/assets

            - name: Create the draft release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_REPO: ${{ github.repository }}
                  RELEASE_TAG: ${{ inputs.release_tag }}
                  WORK: ${{ runner.temp }}
              run: |
                  # --verify-tag aborts instead of creating a missing tag; --draft leaves publishing to a maintainer.
                  gh release create --verify-tag --draft --title "$RELEASE_TAG" --generate-notes -- "$RELEASE_TAG" "$WORK"/assets/*
                  echo "Draft release \`$RELEASE_TAG\` created with the release tarball and its checksum. Publish it from the Releases page." >> "$GITHUB_STEP_SUMMARY"
