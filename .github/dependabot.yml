# Supply-chain rule (billing/docs/devops/DEPENDENCY_POLICY.md): exact pins, nothing younger than 7 days —
# enforced in CI by billing/scripts/check-dependency-age.mjs; Dependabot waits 14 days (cooldown below).
# Security updates ignore the cooldown: label such PRs `security-exception` (CTO approval required).
# Not covered: the `services:` image in .github/workflows/ci.yml — CI asserts it equals compose.yaml,
# so bump it by hand in the same PR as Dependabot's compose.yaml update.
version: 2
updates:
    - package-ecosystem: github-actions
      directories:
          - /
          - /.github/actions/*
      target-branch: develop
      schedule:
          interval: weekly
      cooldown:
          default-days: 14
      groups:
          github-actions:
              patterns:
                  - '*'

    - package-ecosystem: docker-compose
      directory: /billing
      target-branch: develop
      schedule:
          interval: weekly
      cooldown:
          default-days: 14

    - package-ecosystem: composer
      directory: /billing
      target-branch: develop
      schedule:
          interval: weekly
      cooldown:
          default-days: 14
      open-pull-requests-limit: 5

    - package-ecosystem: npm
      directory: /billing
      target-branch: develop
      schedule:
          interval: weekly
      cooldown:
          default-days: 14
      open-pull-requests-limit: 5
