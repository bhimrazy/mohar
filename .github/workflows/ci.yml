# Single CI source of truth for the billing app (the Laravel project lives in billing/).
# Design (billing/docs/devops/CI.md): ONE job to keep billable minutes low — every job is rounded up to a
# whole minute and pays its own setup, so policy, lint, types, static analysis, both test suites and the
# build share one runner, cheapest steps first. Docs-only PRs run only the formatter. Draft PRs and
# feature-branch pushes do not run.
#
# Every third-party action and image is pinned to a commit SHA / digest and must be at least
# MIN_RELEASE_AGE_DAYS old (billing/docs/devops/DEPENDENCY_POLICY.md). Dependabot (14-day cooldown)
# updates the actions and billing/compose.yaml images; it does NOT update `services:` images here, so
# CI fails when the postgres service image drifts from compose.yaml.
name: CI

on:
    push:
        branches:
            - main
            - develop
        paths-ignore:
            - 'billing/docs/screenshots/**'
            - '**/*.png'
    pull_request:
        branches:
            - main
            - develop
        types: [opened, synchronize, reopened, ready_for_review]
        paths-ignore:
            - 'billing/docs/screenshots/**'
            - '**/*.png'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
    run:
        working-directory: billing

env:
    XDEBUG_MODE: 'off'
    MIN_RELEASE_AGE_DAYS: '7'

jobs:
    ci:
        name: CI (policy, lint, types, static, tests, build)
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        services:
            postgres:
                # Must equal the postgres image in billing/compose.yaml (asserted below).
                image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
                env:
                    POSTGRES_DB: billing_test
                    POSTGRES_USER: billing
                    POSTGRES_PASSWORD: billing
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U billing -d billing_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        permissions:
            contents: read
            pull-requests: read # read the security-exception label at run time (re-runs pick it up)
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 2 # HEAD^1 = PR base (merge commit) / previous branch tip (push)

            - name: Detect docs-only change
              id: changes
              run: |
                  code=true
                  if [ "${{ github.event_name }}" = pull_request ]; then
                      files=$(git diff --name-only HEAD^1 HEAD)
                      if [ -n "$files" ] && [ -z "$(grep -vE '(\.md$|^billing/docs/)' <<< "$files")" ]; then
                          code=false
                      fi
                  fi
                  echo "code=$code" >> "$GITHUB_OUTPUT"
                  echo "Code changes: $code"

            - name: Set up app
              uses: ./.github/actions/setup-app
              with:
                  node: 'true'

            - name: vp check (format + lint)
              run: npx vp check

            - name: Postgres image matches compose.yaml
              if: steps.changes.outputs.code == 'true'
              run: |
                  pattern='postgres:[0-9.]+-alpine[0-9.]*@sha256:[0-9a-f]{64}'
                  compose_image=$(grep -Eo "$pattern" compose.yaml | sort -u)
                  ci_image=$(grep -Eo "$pattern" ../.github/workflows/ci.yml | sort -u)
                  echo "compose.yaml: ${compose_image:-<none>}"
                  echo "ci.yml:       ${ci_image:-<none>}"
                  if [ -z "$compose_image" ] || [ "$(wc -l <<< "$compose_image")" -ne 1 ] || [ "$compose_image" != "$ci_image" ]; then
                      echo "::error file=.github/workflows/ci.yml::tests service image must equal the postgres image in billing/compose.yaml"
                      exit 1
                  fi

            - name: Lockfiles in sync and audits
              if: steps.changes.outputs.code == 'true'
              run: |
                  composer validate --no-check-publish
                  composer audit --locked
                  npm audit --audit-level=high

            - name: Dependency cooldown (≥ ${{ env.MIN_RELEASE_AGE_DAYS }} days, changed items)
              if: steps.changes.outputs.code == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
                  GITHUB_TOKEN: ${{ github.token }}
              run: |
                  if [ "${{ github.event_name }}" = pull_request ] \
                      && gh pr view "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --json labels --jq '.labels[].name' | grep -qx security-exception; then
                      echo "::warning::security-exception label present: cooldown violations are reported, not enforced (CTO approval required)."
                      export DEPENDENCY_AGE_EXCEPTION=1
                  fi
                  node scripts/check-dependency-age.mjs --base=HEAD^1

            - name: Pint
              if: steps.changes.outputs.code == 'true'
              run: vendor/bin/pint --parallel --test

            - name: TypeScript
              if: steps.changes.outputs.code == 'true'
              run: npx tsc --noEmit

            - name: Cache PHPStan results
              if: steps.changes.outputs.code == 'true'
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: billing/storage/framework/cache/phpstan
                  key: phpstan-${{ runner.os }}-${{ hashFiles('billing/composer.lock', 'billing/phpstan.neon') }}-${{ github.run_id }}
                  restore-keys: |
                      phpstan-${{ runner.os }}-${{ hashFiles('billing/composer.lock', 'billing/phpstan.neon') }}-
                      phpstan-${{ runner.os }}-

            - name: PHPStan
              if: steps.changes.outputs.code == 'true'
              run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress --error-format=github

            - name: Pest (SQLite)
              if: steps.changes.outputs.code == 'true'
              run: vendor/bin/pest --parallel

            - name: Migrate, seed and Pest (PostgreSQL)
              if: steps.changes.outputs.code == 'true'
              run: composer test:pgsql

            - name: Build
              if: steps.changes.outputs.code == 'true'
              run: npm run build
