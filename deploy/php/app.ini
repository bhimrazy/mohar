; Settings on top of php.ini-production (prod) or php.ini-development (dev).
expose_php = Off
memory_limit = 256M
max_execution_time = 60
; Ticket attachments: 5 files of up to 10 MB each (keep in step with the Caddyfile request_body limit).
upload_max_filesize = 12M
post_max_size = 64M
max_file_uploads = 10
date.timezone = UTC
session.use_strict_mode = 1
; The CA bundle for PHP stream TLS (SMTP STARTTLS, https:// streams) and curl; the slim runtime has no OpenSSL
; default store.
openssl.cafile = /etc/ssl/certs/ca-certificates.crt
curl.cainfo = /etc/ssl/certs/ca-certificates.crt
