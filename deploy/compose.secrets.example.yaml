# Optional override: the PHP containers read APP_KEY and APP_PREVIOUS_KEYS from Docker secrets (files mounted at
# /run/secrets) instead of deploy/.env (billing/docs/devops/key-rotation.md, "Where the key lives").
#
#   sudo install -d -m 0700 -o 10001 -g 10001 /etc/mohar/secrets
#   echo "base64:$(openssl rand -base64 32)" | sudo tee /etc/mohar/secrets/app_key >/dev/null   # or from a secret manager
#   sudo touch /etc/mohar/secrets/app_previous_keys
#   sudo chown 10001:10001 /etc/mohar/secrets/* && sudo chmod 0400 /etc/mohar/secrets/*
#   cp deploy/compose.secrets.example.yaml deploy/compose.secrets.yaml                  # adjust the paths if needed
#   export DEPLOY_COMPOSE_OVERRIDE=deploy/compose.secrets.yaml                          # e.g. in the deploy user's profile
#   deploy/bin/deploy
#
# Leave APP_KEY= and APP_PREVIOUS_KEYS= empty in deploy/.env: a non-empty variable wins over its *_FILE.
# Compose without Swarm bind-mounts secret files with their host owner and mode, so they must be readable by the
# containers' UID 10001. Keep the files outside the repository and the image, and out of the database backups.
# Every manual `docker compose -f deploy/compose.prod.yaml ...` command then needs `-f deploy/compose.secrets.yaml`
# as well.

x-key-secrets: &key-secrets
    environment:
        APP_KEY_FILE: /run/secrets/app_key
        APP_PREVIOUS_KEYS_FILE: /run/secrets/app_previous_keys
    secrets:
        - app_key
        - app_previous_keys

secrets:
    app_key:
        file: /etc/mohar/secrets/app_key
    app_previous_keys:
        file: /etc/mohar/secrets/app_previous_keys

services:
    migrate: *key-secrets
    app-blue: *key-secrets
    worker-critical-blue: *key-secrets
    worker-notifications-blue: *key-secrets
    worker-default-blue: *key-secrets
    worker-automation-blue: *key-secrets
    scheduler-blue: *key-secrets
    app-green: *key-secrets
    worker-critical-green: *key-secrets
    worker-notifications-green: *key-secrets
    worker-default-green: *key-secrets
    worker-automation-green: *key-secrets
    scheduler-green: *key-secrets
